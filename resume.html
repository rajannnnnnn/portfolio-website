<!DOCTYPE html>

<head>

<body>

<div class="noise-overlay"></div>
<div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>
<div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

<nav id="navbar">
  <div class="nav-inner">
    <a href="index.html#top" class="logo">RN<span class="dot">.</span></a>
    <button id="navToggle" class="nav-toggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#skills">Skills</a></li>
      <li><a href="index.html#projects">Projects</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </div>
</nav>

<main>
  <div class="resume-page reveal">
    <a href="index.html#top" class="breadcrumb">← Back to home</a>
    <div class="resume-header">
      <div>
        <p class="section-kicker" style="margin-bottom:8px;">Resume</p>
        <h1 class="resume-title">Rajan N</h1>
        <p class="resume-sub">
          Applied AI Engineer · <span id="resumeDate">loading…</span>
        </p>
      </div>
      <div class="resume-actions">
        <a href="rn-cv.pdf" download class="btn btn-primary magnetic">Download PDF ↓</a>
        <a href="rn-cv.pdf" target="_blank" rel="noopener" class="btn btn-outline magnetic">Open in new tab ↗</a>
      </div>
    </div>

    <div class="resume-viewer-wrap">
      <div class="resume-viewer-loading" id="resumeLoading">
        <div class="resume-spinner" aria-hidden="true"></div>
        <p>Loading resume…</p>
      </div>
      <div id="resumePages" class="resume-pages"></div>
      <div class="resume-viewer-fallback" id="resumeFallback" hidden>
        <p>Can't render the PDF inline here.
          <a href="rn-cv.pdf" target="_blank" rel="noopener">Open it in a new tab</a>
          or <a href="rn-cv.pdf" download>download it</a>.</p>
      </div>
    </div>
  </div>
</main>

<footer>
  <p>&copy; <span id="year"></span> Rajan N. Built with plain HTML, CSS &amp; JS.</p>
</footer>

<script src="script.js"></script>
<script type="module">
  // Auto-fetch the last-updated date from GitHub Commits API
  (async function fetchResumeDate() {
    const el = document.getElementById('resumeDate');
    try {
      const resp = await fetch(
        'https://api.github.com/repos/rajannnnnnn/portfolio-website/commits?path=rn-cv.pdf&per_page=1',
        { headers: { 'Accept': 'application/vnd.github+json' } }
      );
      if (!resp.ok) throw new Error('github api ' + resp.status);
      const data = await resp.json();
      if (!Array.isArray(data) || data.length === 0) throw new Error('no commits');
      const iso = data[0].commit && data[0].commit.author && data[0].commit.author.date;
      if (!iso) throw new Error('no date');
      const d = new Date(iso);
      const fmt = d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
      el.textContent = 'Last updated ' + fmt;
    } catch (e) {
      el.textContent = 'Last updated recently';
    }
  })();

  // Render the PDF with PDF.js so it displays inline on every device, including mobile
  import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs';

  const loading = document.getElementById('resumeLoading');
  const container = document.getElementById('resumePages');
  const fallback = document.getElementById('resumeFallback');
  let rendered = false;

  function fail() {
    if (rendered) return;
    loading.hidden = true;
    container.hidden = true;
    fallback.hidden = false;
  }

  // Hard safety net: if PDF.js can't load or render within 15s, show the fallback
  setTimeout(() => { if (!rendered) fail(); }, 15000);

  async function renderResume() {
    try {
      const task = pdfjsLib.getDocument('rn-cv.pdf');
      const pdf = await task.promise;
      const target = Math.min(container.clientWidth || window.innerWidth - 60, 1000);
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const base = page.getViewport({ scale: 1 });
        const scale = target / base.width;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const viewport = page.getViewport({ scale: scale * dpr });

        const canvas = document.createElement('canvas');
        canvas.className = 'resume-page-canvas';
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = (viewport.width / dpr) + 'px';
        canvas.style.height = (viewport.height / dpr) + 'px';
        container.appendChild(canvas);

        const ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport }).promise;
      }
      rendered = true;
      loading.hidden = true;
    } catch (e) {
      console.error('pdf render failed', e);
      fail();
    }
  }

  renderResume();
</script>
</body>
</html>
