<!DOCTYPE html>

<body>

<nav id="navbar">
  <div class="nav-inner">
    <a href="index.html#top" class="logo">RN<span class="dot">.</span></a>
    <button id="navToggle" class="nav-toggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#skills">Skills</a></li>
      <li><a href="index.html#projects">Projects</a></li>

    </ul>

</nav>

<main>
  <div class="resume-page reveal">
    <a href="index.html#top" class="breadcrumb">← Back to home</a>
    <div class="resume-header">
      <div>
        <p class="section-kicker" style="margin-bottom:8px;">Resume</p>
        <h1 class="resume-title">Rajan N</h1>
        <p class="resume-sub">
          <span>Applied AI Engineer</span>
          <span class="resume-freshness" id="resumeDate" aria-live="polite">
            <span class="resume-freshness-dot" aria-hidden="true"></span>
            <span class="resume-freshness-label">Checking freshness…</span>
          </span>
        </p>
      </div>
      <div class="resume-actions">
        <a href="rn-cv.pdf" download class="btn btn-primary magnetic">Download PDF ↓</a>
      </div>
    </div>

    <div class="resume-viewer-wrap">
      <div class="resume-viewer-loading" id="resumeLoading">
        <div class="resume-spinner" aria-hidden="true"></div>
        <p>Loading resume…</p>
      </div>
      <div id="resumePages" class="resume-pages"></div>
      <div class="resume-viewer-fallback" id="resumeFallback" hidden>
        <p>Can't render the PDF inline here.
          <a href="rn-cv.pdf" download>Download it</a> instead.</p>
      </div>
    </div>
  </div>
</main>

<footer>
  <p>&copy; <span id="year"></span> Rajan N. Built with plain HTML, CSS &amp; JS.</p>
</footer>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
  // Hardcoded resume upload date — bump this when you re-upload rn-cv.pdf.
  // Compared against today using calendar days (not 24-hour chunks), so a
  // PDF uploaded late yesterday says "Updated yesterday" after midnight, not
  // "Updated today" for the first 24 hours.
  const RESUME_UPDATED = '2026-10-02';

  (function setFreshness() {
    const root = document.getElementById('resumeDate');
    const label = root && root.querySelector('.resume-freshness-label');
    if (!label) return;

    const [y, m, d] = RESUME_UPDATED.split('-').map(Number);
    const updated = new Date(y, m - 1, d);
    const today = new Date();
    const todayLocal = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const days = Math.round((todayLocal - updated) / 86400000);

    let text, tier;
    if (days <= 0) { text = 'Updated today'; tier = 'hot'; }
    else if (days === 1) { text = 'Updated yesterday'; tier = 'hot'; }
    else if (days < 7) { text = 'Updated ' + days + ' days ago'; tier = 'hot'; }
    else if (days < 14) { text = 'Updated last week'; tier = 'warm'; }
    else if (days < 30) { text = 'Updated ' + Math.floor(days / 7) + ' weeks ago'; tier = 'warm'; }
    else if (days < 60) { text = 'Updated last month'; tier = 'warm'; }
    else {
      text = 'Updated ' + updated.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
      tier = 'cool';
    }
    label.textContent = text;
    root.setAttribute('data-fresh', tier);
  })();

  const loading = document.getElementById('resumeLoading');
  const container = document.getElementById('resumePages');
  const fallback = document.getElementById('resumeFallback');
  let rendered = false;

  function fail() {
    if (rendered) return;
    loading.hidden = true;
    container.hidden = true;
    fallback.hidden = false;
  }

  // Hard safety net: if PDF.js can't load or render within 15s, show the fallback
  setTimeout(() => { if (!rendered) fail(); }, 15000);

  async function renderResume() {
    try {
      if (typeof pdfjsLib === 'undefined') { fail(); return; }
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
      const task = pdfjsLib.getDocument('rn-cv.pdf');
      const pdf = await task.promise;
      const target = Math.min(container.clientWidth || window.innerWidth - 60, 1000);
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const base = page.getViewport({ scale: 1 });
        const scale = target / base.width;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const viewport = page.getViewport({ scale: scale * dpr });

        const canvas = document.createElement('canvas');
        canvas.className = 'resume-page-canvas';
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = (viewport.width / dpr) + 'px';
        canvas.style.height = (viewport.height / dpr) + 'px';
        container.appendChild(canvas);

        const ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport }).promise;

        // Hide the loading spinner as soon as the first page is on screen —
        // subsequent pages append under it without the stale "Loading…" message.
        if (i === 1) {
          rendered = true;
          loading.hidden = true;
        }
      }
    } catch (e) {
      console.error('pdf render failed', e);
      fail();
    }
  }

  renderResume();
</script>
</body>
</html>
