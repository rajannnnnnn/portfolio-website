<main>
  <div class="resume-page reveal">

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
  // Auto-fetch the last-updated date from GitHub Commits API, format as a
  // fresh-sounding relative label, and set an age tier so CSS can style
  // very-fresh updates in a brighter accent.
  (function fetchResumeDate() {
    const root = document.getElementById('resumeDate');
    const label = root && root.querySelector('.resume-freshness-label');
    function set(text, tier) {
      if (!label) return;
      label.textContent = text;
      if (tier) root.setAttribute('data-fresh', tier);
    }
    function relLabel(iso) {
      const d = new Date(iso);
      const now = Date.now();
      const days = Math.floor((now - d.getTime()) / 86400000);
      if (days <= 0) return { text: 'Updated today', tier: 'hot' };
      if (days === 1) return { text: 'Updated yesterday', tier: 'hot' };
      if (days < 7) return { text: 'Updated ' + days + ' days ago', tier: 'hot' };
      if (days < 14) return { text: 'Updated last week', tier: 'warm' };
      if (days < 30) return { text: 'Updated ' + Math.floor(days / 7) + ' weeks ago', tier: 'warm' };
      if (days < 60) return { text: 'Updated last month', tier: 'warm' };
      if (days < 365) return {
        text: 'Updated ' + d.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }),
        tier: 'cool'
      };
      return {
        text: 'Updated ' + d.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }),
        tier: 'cool'
      };
    }
    (async () => {
      try {
        const resp = await fetch(
          'https://api.github.com/repos/rajannnnnnn/portfolio-website/commits?path=rn-cv.pdf&per_page=1',
          { headers: { 'Accept': 'application/vnd.github+json' } }
        );
        if (!resp.ok) throw new Error('github api ' + resp.status);
        const data = await resp.json();
        if (!Array.isArray(data) || data.length === 0) throw new Error('no commits');
        const iso = data[0].commit && data[0].commit.author && data[0].commit.author.date;
        if (!iso) throw new Error('no date');
        const { text, tier } = relLabel(iso);
        set(text, tier);
      } catch (e) {
        set('Updated recently', 'warm');
      }
    })();
  })();

  const loading = document.getElementById('resumeLoading');
  const container = document.getElementById('resumePages');
  const fallback = document.getElementById('resumeFallback');
  let rendered = false;

  function fail() {
    if (rendered) return;
    loading.hidden = true;
    container.hidden = true;
    fallback.hidden = false;
  }

  // Hard safety net: if PDF.js can't load or render within 15s, show the fallback
  setTimeout(() => { if (!rendered) fail(); }, 15000);

  async function renderResume() {
    try {
      if (typeof pdfjsLib === 'undefined') { fail(); return; }
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
      const task = pdfjsLib.getDocument('rn-cv.pdf');
      const pdf = await task.promise;
      const target = Math.min(container.clientWidth || window.innerWidth - 60, 1000);
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const base = page.getViewport({ scale: 1 });
        const scale = target / base.width;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const viewport = page.getViewport({ scale: scale * dpr });

        const canvas = document.createElement('canvas');
        canvas.className = 'resume-page-canvas';
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = (viewport.width / dpr) + 'px';
        canvas.style.height = (viewport.height / dpr) + 'px';
        container.appendChild(canvas);

        const ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport }).promise;

        // Hide the loading spinner as soon as the first page is on screen —
        // subsequent pages append under it without the stale "Loading…" message.
        if (i === 1) {
          rendered = true;
          loading.hidden = true;
        }
      }
    } catch (e) {
      console.error('pdf render failed', e);
      fail();
    }
  }

  renderResume();
</script>
</body>
</html>
